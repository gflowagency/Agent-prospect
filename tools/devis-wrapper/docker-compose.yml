services:
  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?définir BROWSERLESS_TOKEN dans .env}
      CONCURRENT: "2"
      TIMEOUT: "120000"
    # pas de port publié à l'extérieur : seul le wrapper doit lui parler,
    # sur le réseau interne docker-compose.
    expose:
      - "3000"

  wrapper:
    build: .
    restart: unless-stopped
    depends_on:
      - browserless
    environment:
      PORT: "8090"
      WRAPPER_API_KEY: ${WRAPPER_API_KEY:?définir WRAPPER_API_KEY dans .env}
      BROWSERLESS_URL: "http://browserless:3000"
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:?définir BROWSERLESS_TOKEN dans .env}
    ports:
      - "8090:8090"
